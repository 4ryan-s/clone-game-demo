# Use with the main file on a Mac or any machine with no NVIDIA GPU.
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
# !reset drops the NVIDIA device reservation from docker-compose.yml. An empty list does not.
services:
  qwen:
    build:
      args:
        TORCH_VARIANT: cpu
    deploy: !reset null
  api:
    build:
      args:
        ONNX_GPU: "0"
    environment:
      SPECTRA_DEVICE: cpu
    deploy: !reset null
